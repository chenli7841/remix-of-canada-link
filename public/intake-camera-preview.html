<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入库相机扫描 · 模拟</title><style>*{box-sizing:border-box}body{margin:0;background:#080e18;color:#e7eefb;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}.phone{max-width:430px;margin:auto;min-height:100dvh;background:#0c1422}header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #283448}a{color:#8dc4ff;text-decoration:none}h1{font-size:19px;margin:0}.tag{color:#ffcd67;font-size:11px;border:1px solid #755b27;border-radius:5px;padding:2px 6px}main{padding:16px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.camera{height:270px;background:radial-gradient(ellipse at 40% 35%,#53616d,#1b2732 58%,#101923);border-radius:14px;position:relative;overflow:hidden;border:1px solid #3a4b5e}.parcel{position:absolute;inset:45px 40px 38px;background:#99866a;border-radius:5px;transform:rotate(-6deg);box-shadow:0 10px 35px #0008;padding:23px}.label{background:#f6f4eb;color:#141414;padding:12px;text-align:center;font-size:11px}.barcode{height:49px;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 4px,#111 4px 5px,#fff 5px 9px);margin:7px 0}.frame{position:absolute;inset:61px 27px 65px;border:2px solid #61b3ff;border-radius:10px;box-shadow:0 0 0 90px #0003}.scanline{position:absolute;top:40%;left:0;right:0;height:2px;background:#50d4ff;box-shadow:0 0 12px #53caff;animation:scan 2.5s linear infinite alternate}@keyframes scan{to{top:80%}}.camera-tip{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:white;font-size:12px}.status{margin-top:12px;padding:12px;border:1px solid #1e6756;background:#10372e;color:#73e9c4;border-radius:10px}.status small{display:block;color:#a7cabc;margin-top:4px}button{cursor:pointer;color:#e8f2ff;background:#17314e;border:1px solid #305a87;padding:11px;border-radius:9px;font:inherit;min-height:44px}.buttons{display:flex;gap:8px;margin-top:12px}.buttons button{flex:1}.primary{background:#1379e9;border-color:#1379e9}.subtitle{color:#92a5c0;font-size:12px;margin:9px 0 16px}.records{border:1px solid #29384d;border-radius:12px;overflow:hidden}.records h2{font-size:14px;margin:0;padding:13px;background:#152235;display:flex;justify-content:space-between}.record{padding:13px;border-top:1px solid #29384d}.record strong{font:700 13px ui-monospace,monospace;display:block}.meta{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:#95a9c3}.success{color:#59dcb5}.foot{font-size:11px;color:#7f93ae;margin:16px 0}.manual{margin-top:10px;display:flex;gap:7px}input{width:100%;min-width:0;background:#0a111e;border:1px solid #354b67;border-radius:8px;color:white;padding:10px}dialog{background:#132033;color:#e7eefb;border:1px solid #3a526f;border-radius:14px;max-width:340px;width:90%}dialog::backdrop{background:#000a}</style><div class="phone"><header><a href="/admin/intake-scan">‹ 返回入库</a><span class="tag">模拟页面</span></header><main><div class="head"><h1>相机扫描</h1><span style="color:#72b8ff;font-size:12px" id="mode">连续扫描中</span></div><div class="camera" id="camera"><div class="parcel"><div class="label"><b>EPLUS · 运单</b><div class="barcode"></div>SCC-DEMO-001</div></div><div class="frame"><div class="scanline" id="line"></div></div><div class="camera-tip">将条形码放入框内 · 识别后可继续扫下一件</div></div><div class="status" id="status" role="status">等待识别条形码<small>这是模拟取景画面，点击下方按钮体验识别结果。</small></div><div class="buttons"><button class="primary" id="simulate">模拟扫到一件</button><button id="pause">暂停扫描</button></div><div class="buttons"><button id="duplicate">模拟重复扫描</button><button id="box">模拟订单号</button></div><p class="subtitle">运单号：直接收件；订单号 / 国内单号：填写箱数后继续。</p><section class="records"><h2>本次扫描记录 <span id="count">0 件</span></h2><div id="rows"><div class="record" style="color:#879cb6" id="empty">尚未扫描包裹</div></div></section><p class="foot">仅演示交互与布局，不连接相机、不查询真实单号、不产生入库记录。</p></main></div><dialog id="boxes"><h3>填写箱数</h3><p>已识别集运订单 FWH-DEMO-001</p><label for="quantity">包裹箱数</label><div class="manual"><input id="quantity" type="number" min="1" max="99" value="1"><button id="confirm" class="primary">模拟确认</button></div><button id="cancel" style="width:100%;margin-top:12px">取消</button><p class="foot">模拟确认不生成真实运单。</p></dialog><script>let n=0,paused=false;const el=id=>document.getElementById(id);function message(title,detail){el('status').replaceChildren();el('status').append(document.createTextNode(title));const s=document.createElement('small');s.textContent=detail;el('status').append(s)}function add(){if(paused)return;el('empty')?.remove();n++;const no='SCC-DEMO-'+String(n).padStart(3,'0');const row=document.createElement('div');row.className='record';row.innerHTML='<strong>'+no+'</strong><div class="meta"><span>客户 01873 · 第 '+n+' 件</span><span class="success">已模拟收件 ✓</span></div>';el('rows').prepend(row);el('count').textContent=n+' 件';message('✓ 识别成功 · '+no,'已模拟收件，可继续扫描下一件。')}el('simulate').onclick=add;el('duplicate').onclick=()=>{if(!paused)message(n?'本次已扫描，已跳过':'尚无扫描记录',n?'同一单号不重复加入本次列表。':'请先点击“模拟扫到一件”。')};el('pause').onclick=()=>{paused=!paused;el('line').style.animationPlayState=paused?'paused':'running';el('pause').textContent=paused?'继续扫描':'暂停扫描';el('mode').textContent=paused?'已暂停':'连续扫描中';el('simulate').disabled=el('duplicate').disabled=el('box').disabled=paused};el('box').onclick=()=>el('boxes').showModal();el('cancel').onclick=()=>el('boxes').close();el('confirm').onclick=()=>{const q=Number(el('quantity').value);if(!Number.isInteger(q)||q<1||q>99){el('quantity').reportValidity();return}el('boxes').close();message('✓ 已模拟确认 '+q+' 箱','实际流程将生成运单，本预览不会写入系统。')};</script></html>
